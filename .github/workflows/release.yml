name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    uses: IUCLabs/workflows/.github/workflows/release-terraform-provider.yml@v0.1.0
    permissions:
      contents: write
      id-token: write
    with:
      vault_role: release-shared

  # artifactapi consumers still resolve the pre-rename filename and path
  legacy-upload:
    needs: release
    runs-on: iuclabs-release
    permissions:
      id-token: write
    env:
      VAULT_ADDR: https://vault.service.consul:8200
      ARTIFACTAPI: https://artifactapi.k8s.syd1.au.unkin.net
    steps:
      - uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          path: jwt/github/iuclabs
          role: release
          jwtGithubAudience: ${{ env.VAULT_ADDR }}
          secrets: |
            identity/oidc/token/artifactapi-writer token | ARTIFACTAPI_TOKEN
      - name: Upload linux_amd64 to artifactapi under the legacy name
        run: |
          v="${GITHUB_REF_NAME#v}"
          src="${GITHUB_REPOSITORY#*/}_${v}_linux_amd64.zip"
          file="terraform-provider-ranchervaultsecret_${v}_linux_amd64.zip"
          curl -sSfL --cacert /etc/vault-ca/ca.crt -o "${file}" \
            "${ARTIFACTAPI}/api/v1/remote/github/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${src}"
          curl -sSf --cacert /etc/vault-ca/ca.crt -X PUT \
            -H "Authorization: Bearer ${ARTIFACTAPI_TOKEN}" -H "Content-Type: application/zip" \
            --data-binary "@${file}" \
            "${ARTIFACTAPI}/api/v2/remotes/terraform-unkin/files/unkin/ranchervaultsecret/${file}"
