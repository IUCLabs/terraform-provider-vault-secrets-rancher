when:
  - event: tag

steps:
  - name: package
    image: git.unkin.net/unkin/almalinux9-gobuilder:20260606
    commands:
      - make package VERSION=${CI_COMMIT_TAG}
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2

  - name: upload
    image: git.unkin.net/unkin/almalinux9-base:20260606
    commands:
      - |
        VERSION=$$(echo ${CI_COMMIT_TAG} | sed 's/^v//')
        FILE="terraform-provider-ranchervaultsecret_$${VERSION}_linux_amd64.zip"
        curl -f -X PUT \
          "https://artifactapi.k8s.syd1.au.unkin.net/api/v2/remotes/terraform-unkin/files/unkin/ranchervaultsecret/$${FILE}" \
          -H "Content-Type: application/zip" \
          --data-binary @"$${FILE}"
    depends_on: [package]
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
