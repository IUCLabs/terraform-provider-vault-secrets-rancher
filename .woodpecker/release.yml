when:
  - event: tag

steps:
  - name: package
    image: artifactapi.k8s.syd1.au.unkin.net/docker-internal/gobuilder:0.1.2-alma9
    environment:
      GOCACHE_S3_BUCKET: gocache
      GOCACHE_S3_REGION: us-east-1
      GOCACHE_S3_ENDPOINT_URL: https://s3.ceph.unkin.net
      GOCACHE_S3_PATH_STYLE: "true"
      GOCACHE_KEY_PREFIX: ci-terraform-provider-ranchervaultsecret
      GOCACHE_METRICS: "true"
      GOCACHEPROG: go-cache-plugin --cache-dir=/tmp/gocache
      AWS_ACCESS_KEY_ID:
        from_secret: GOCACHE_AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: GOCACHE_AWS_SECRET_ACCESS_KEY
    commands:
      - make package VERSION=${CI_COMMIT_TAG}
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 512Mi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2

  - name: upload
    image: git.unkin.net/unkin/almalinux9-base:20260606
    commands:
      - |
        VERSION=$$(echo ${CI_COMMIT_TAG} | sed 's/^v//')
        FILE="terraform-provider-ranchervaultsecret_$${VERSION}_linux_amd64.zip"
        curl -f -X PUT \
          "https://artifactapi.k8s.syd1.au.unkin.net/api/v2/remotes/terraform-unkin/files/unkin/ranchervaultsecret/$${FILE}" \
          -H "Content-Type: application/zip" \
          --data-binary @"$${FILE}"
    depends_on: [package]
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
